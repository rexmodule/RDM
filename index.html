<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zee Bangla HD Player</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
}

.player-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <video id="video"
           controls
           autoplay
           muted
           playsinline>
    </video>
</div>

<script>

const video = document.getElementById('video');

const streamURL =
    'https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/ZeeBanglaHD.m3u8';

if (Hls.isSupported()) {

    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
    });

    hls.loadSource(streamURL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, function (event, data) {

        console.error('HLS error:', data);

        if (data.fatal) {

            switch (data.type) {

                case Hls.ErrorTypes.NETWORK_ERROR:
                    console.log('Network error - retrying...');
                    hls.startLoad();
                    break;

                case Hls.ErrorTypes.MEDIA_ERROR:
                    console.log('Media error - recovering...');
                    hls.recoverMediaError();
                    break;

                default:
                    hls.destroy();
                    break;
            }
        }
    });

}
else if (video.canPlayType('application/vnd.apple.mpegurl')) {

    // Safari / browsers with native HLS support
    video.src = streamURL;

    video.addEventListener('loadedmetadata', function () {
        video.play().catch(() => {});
    });

}
else {

    alert('This browser does not support HLS playback.');

}

</script>

</body>
</html>
