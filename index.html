<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zee Bangla Fullscreen Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background-color: black;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline controls></video>

  <script>
    async function initPlayer() {
      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      player.configure({
        drm: {
          clearKeys: {
            '1df83e058b864da896c9288eef63b113': 'fc32f26239054b56aab48225305598fe'
          }
        },
        abr: {
          enabled: false
        }
      });

      try {
        await player.load('https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeebangla/default/manifest.mpd');
        console.log('The video has now been loaded!');

        // Set to highest resolution
        const tracks = player.getVariantTracks();
        const highest = tracks.reduce((a, b) => a.height > b.height ? a : b);
        if (highest) {
          player.selectVariantTrack(highest, true);
          console.log(`Selected resolution: ${highest.height}p`);
        }

        // Attempt to play
        await video.play();

        // Try to unmute after a short delay
        setTimeout(() => {
          video.muted = false;
        }, 1000);

        // Request fullscreen
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }

      } catch (error) {
        console.error('Error initializing the player:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
