<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HLS Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #player-container {
            width: 100%;
            height: 100%;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
    </style>
</head>

<body>

<div id="player-container">
    <video
        id="video"
        controls
        autoplay
        playsinline
        webkit-playsinline>
    </video>
</div>

<script>

const video = document.getElementById("video");

const streamURL =
    "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/ZeeBanglaHD.m3u8";

let hls = null;


/* =========================================================
   PLAY STREAM
   ========================================================= */

function enterFullscreen() {
    const container = document.getElementById("player-container");

    if (document.fullscreenElement || document.webkitFullscreenElement)
        return;

    const request =
        container.requestFullscreen ||
        container.webkitRequestFullscreen;

    if (request) {
        try {
            const result = request.call(container);
            if (result && result.catch) result.catch(() => {});
        } catch (e) {}
    }
}

function playStream() {

    if (Hls.isSupported()) {

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 30
        });

        hls.loadSource(streamURL);
        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                video.muted = false;
                video.volume = 1.0;

                video.muted = false;
                video.defaultMuted = false;
                video.volume = 1.0;

                video.play().then(() => {
                    enterFullscreen();
                }).catch(error => {

                    console.log(
                        "Autoplay with sound blocked:",
                        error
                    );

                    /*
                     * Browser autoplay policy may require
                     * muted playback.
                     */

                    video.muted = true;

                    video.play().then(() => {
                        enterFullscreen();
                    }).catch(error => {
                        console.error(error);
                    });

                });

            }
        );


        /* HLS error recovery */

        video.addEventListener("playing", function () {
            video.defaultMuted = false;
            video.muted = false;
            video.volume = 1.0;
            enterFullscreen();
        });

        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.error("HLS error:", data);

                if (!data.fatal)
                    return;

                switch (data.type) {

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.log(
                            "Network error - reconnecting..."
                        );

                        hls.startLoad();

                        break;


                    case Hls.ErrorTypes.MEDIA_ERROR:

                        console.log(
                            "Media error - recovering..."
                        );

                        hls.recoverMediaError();

                        break;


                    default:

                        console.log(
                            "Fatal HLS error"
                        );

                        hls.destroy();
                        hls = null;

                        break;
                }
            }
        );

    }

    /* Native HLS (Safari etc.) */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = streamURL;

        video.addEventListener(
            "loadedmetadata",
            function () {

                video.muted = false;
                video.volume = 1.0;

                video.play().then(() => {
                    enterFullscreen();
                }).catch(() => {

                    video.muted = true;

                    video.play().then(() => {
                        enterFullscreen();
                    });

                });

            },
            { once: true }
        );

    }

    else {

        alert(
            "This browser does not support HLS playback."
        );

    }
}


/* =========================================================
   START AUTOMATICALLY
   ========================================================= */

window.addEventListener(
    "load",
    function () {

        playStream();

    }
);

</script>

</body>
</html>
