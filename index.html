<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zee Bangla</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100%;
      width: 100%;
    }
    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background-color: black;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay muted playsinline controls></video>
  </div>

  <script>
    async function initPlayer() {
      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      player.configure({
        drm: {
          clearKeys: {
            '1df83e058b864da896c9288eef63b113': 'fc32f26239054b56aab48225305598fe'
          }
        },
        abr: {
          enabled: false  // Manual quality selection
        }
      });

      try {
        await player.load('https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeebangla/default/manifest.mpd');
        console.log('Stream loaded');

        // Select the highest available resolution
        const tracks = player.getVariantTracks();
        const best = tracks.reduce((a, b) => a.height > b.height ? a : b);
        if (best) {
          player.selectVariantTrack(best, true);
          console.log(`Resolution: ${best.height}p`);
        }

        // Autoplay muted
        await video.play();

        // Attempt to unmute after short delay
        setTimeout(() => {
          video.muted = false;
        }, 1000);

      } catch (error) {
        console.error('Error playing video:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
